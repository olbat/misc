# jail.yaml — Bubblewrap sandbox profiles for AI coding agents
#
# Each profile defines:
#   ro_paths          - host paths mounted read-only
#   rw_paths          - host paths mounted read-write (changes persist)
#   allowed_commands  - binaries whitelisted into sandbox /usr/bin
#   env               - environment variables ($VAR = pass through from host)
#   tmpfs             - tmpfs mounts (string or {path, size} dict)
#   symlinks          - symlinks to create inside the sandbox
#   share_net         - allow network access (default: FALSE)
#   new_session       - create a new terminal session (default: true)
#   die_with_parent   - kill sandbox when parent exits (default: true)
#   hostname          - custom hostname inside the sandbox
#   bwrap             - sandbox backend: true = bubblewrap (default), false = Landlock
#
# Paths support ~ for home directory expansion.
#
# IMPORTANT: Do NOT mount /usr or /usr/bin as ro_paths — this exposes
# every binary on the host and makes allowed_commands meaningless.
# Mount /usr/lib (shared libraries) and specific /usr/share subdirs instead.

profiles:
  shell:
    # Minimal profile for interactive testing — no agent, no network
    ro_paths:
      - /usr/lib
      - /lib
      - /lib64
      - /usr/share/terminfo     # terminal definitions for interactive use

    rw_paths: []

    allowed_commands:
      - bash
      - sh
      - env
      - ls
      - cat
      - head
      - tail
      - grep
      - find
      - sed
      - awk
      - sort
      - uniq
      - wc
      - cut
      - tr
      - tee
      - xargs
      - echo
      - printf
      - cp
      - mv
      - mkdir
      - rm
      - touch
      - chmod
      - stat
      - file
      - diff
      - dirname
      - basename
      - readlink
      - date
      - id
      - whoami
      - uname
      - true
      - false
      - test
      - pwd

    env:
      HOME: /tmp
      TERM: $TERM
      PATH: /usr/bin:/usr/local/bin

    share_net: false
    new_session: true
    die_with_parent: true
    hostname: sandbox

    tmpfs:
      - path: /tmp
        size: 67108864    # 64 MiB

    symlinks:
      /usr/bin/sh: /usr/bin/bash

  claude:
    ro_paths:
      - /usr/lib
      - /usr/share/ca-certificates
      - /lib
      - /lib64
      - /etc/resolv.conf
      - /etc/ssl
      - /etc/ca-certificates

    rw_paths:
      - ~/project
      - ~/.claude              # agent state (history, cache, settings)
      - ~/.claude.json         # agent config

    allowed_commands:
      - claude
      - git
      - node
      - python3
